<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚜 叉车驾驶员信息核查系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .header h1 {
            color: #1890ff;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #666;
            font-size: 16px;
        }
        
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #666;
            font-size: 18px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1890ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-box {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            color: #ff4d4f;
        }
        
        .forklift-card {
            background: #f8fbff;
            border: 1px solid #e6f7ff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .forklift-card h2 {
            color: #1890ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #e8e8e8;
        }
        
        .label {
            color: #595959;
            font-weight: 500;
        }
        
        .value {
            color: #262626;
            font-weight: 600;
            text-align: right;
        }
        
        .drivers-section {
            margin-top: 30px;
        }
        
        .drivers-section h2 {
            color: #52c41a;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .drivers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .driver-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .driver-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #bae7ff;
        }
        
        .driver-card.selected {
            background: #f0f9ff;
            border-color: #1890ff;
            box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
        }
        
        .driver-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }
        
        .driver-name {
            font-size: 18px;
            color: #1890ff;
            font-weight: bold;
        }
        
        .driver-id {
            color: #8c8c8c;
            font-size: 14px;
            margin-top: 4px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-valid {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        
        .badge-warning {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }
        
        .badge-expired {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        
        .driver-details {
            background: #fafafa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .detail-row {
            display: flex;
            margin: 8px 0;
        }
        
        .detail-label {
            color: #8c8c8c;
            min-width: 100px;
            font-size: 14px;
        }
        
        .detail-value {
            color: #262626;
            flex: 1;
            font-weight: 500;
            word-break: break-all;
        }
        
        .expiry-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #f0f0f0;
        }
        
        .expiry-date {
            font-weight: bold;
            font-size: 16px;
        }
        
        .expiry-valid {
            color: #52c41a;
        }
        
        .expiry-warning {
            color: #fa8c16;
        }
        
        .expiry-expired {
            color: #ff4d4f;
        }
        
        .photo-container {
            margin-top: 15px;
        }
        
        .driver-photo {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e8e8e8;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .driver-photo:hover {
            transform: scale(1.02);
        }
        
        .no-photo {
            text-align: center;
            color: #bfbfbf;
            font-style: italic;
            padding: 20px;
            border: 2px dashed #e8e8e8;
            border-radius: 8px;
        }
        
        .action-section {
            background: #fafafa;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
        }
        
        .action-btn {
            background: linear-gradient(135deg, #52c41a, #73d13d);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(82, 196, 26, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(82, 196, 26, 0.4);
        }
        
        .action-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .selected-info {
            margin-top: 15px;
            color: #595959;
            font-size: 16px;
        }
        
        .selected-info strong {
            color: #1890ff;
        }
        
        .footer {
            text-align: center;
            color: #8c8c8c;
            font-size: 14px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        
        .scan-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 10px;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
        }
        
        .modal-img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .no-drivers {
            text-align: center;
            color: #bfbfbf;
            font-style: italic;
            padding: 40px;
            border: 2px dashed #e8e8e8;
            border-radius: 8px;
            grid-column: 1 / -1;
        }
        
        .api-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        
        .status-connected {
            background: #52c41a;
        }
        
        .status-disconnected {
            background: #ff4d4f;
        }
        
        .proxy-selector {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #f6ffed;
            border-radius: 8px;
            border: 1px solid #b7eb8f;
        }
        
        .proxy-selector select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #d9d9d9;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .drivers-grid {
                grid-template-columns: 1fr;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .scan-info {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚜 叉车驾驶员信息核查系统</h1>
            <p>扫码确认驾驶员资质，确保安全生产</p>
        </div>
        
        <div class="proxy-selector">
            <label for="proxy-select">选择代理服务：</label>
            <select id="proxy-select" onchange="changeProxy(this.value)">
                <option value="cors-anywhere">CORS Anywhere (推荐)</option>
                <option value="allorigins">AllOrigins</option>
                <option value="corsproxy">CORS Proxy</option>
                <option value="none">无代理 (可能失败)</option>
            </select>
            <p style="font-size: 12px; color: #666; margin-top: 8px;">
                注意：使用CORS Anywhere可能需要先访问 <a href="https://cors-anywhere.herokuapp.com/" target="_blank">https://cors-anywhere.herokuapp.com/</a> 请求临时访问
            </p>
        </div>
        
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>正在从数据库加载信息，请稍候...</p>
            <div id="api-status" class="api-status">
                <span class="status-indicator status-disconnected"></span>
                <span>正在连接数据库...</span>
            </div>
        </div>
        
        <div id="error-container" class="error-box" style="display: none;">
            <h3>❌ 数据加载失败</h3>
            <p id="error-message"></p>
            <button id="retry-btn" style="margin-top: 10px; padding: 8px 16px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                重试
            </button>
        </div>
        
        <div id="content" style="display: none;">
            <!-- 叉车信息 -->
            <div class="forklift-card">
                <h2>📱 设备信息</h2>
                <div class="info-grid" id="forklift-details"></div>
            </div>
            
            <!-- 驾驶员列表 -->
            <div class="drivers-section">
                <h2>👨‍✈️ 授权驾驶员列表</h2>
                <p style="color: #666; margin-bottom: 20px; font-size: 15px;">
                    请点击选择当前正在操作此叉车的驾驶员：
                </p>
                <div class="drivers-grid" id="drivers-container"></div>
            </div>
            
            <!-- 操作确认 -->
            <div class="action-section">
                <button id="submit-btn" class="action-btn" onclick="submitRecord()" disabled>
                    <span>✅ 确认提交操作记录</span>
                </button>
                <div class="selected-info" id="selected-info">
                    已选择驾驶员：<strong id="selected-driver-name">请从上方选择</strong>
                </div>
            </div>
            
            <!-- 底部信息 -->
            <div class="footer">
                <div class="scan-info">
                    <span>扫码时间：<span id="scan-time"></span></span>
                    <span>数据更新时间：<span id="data-update-time"></span></span>
                </div>
                <p>系统已记录操作日志 | 安全生产，人人有责</p>
            </div>
        </div>
    </div>
    
    <!-- 图片查看模态框 -->
    <div class="modal" id="image-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">×</button>
            <img id="modal-image" class="modal-img" src="" alt="驾驶证照片">
        </div>
    </div>

    <script>
        // ========== SeaTable 配置 ==========
        const SEATABLE_CONFIG = {
            // 您的SeaTable API Token
            apiToken: '51566050495ad6fbb04804b595a5dd7335bc2d39',
            
            // 您的Base UUID
            baseUuid: '8cde0474-c2d4-4a4e-b7bb-65b481497b88',
            
            // 子表名称（必须和SeaTable中完全一致）
            tableNames: {
                forklift: '叉车信息',
                driver: '驾驶员信息'
            }
        };
        
        // 可用的CORS代理服务
        const PROXY_SERVICES = {
            'cors-anywhere': 'https://cors-anywhere.herokuapp.com/',
            'allorigins': 'https://api.allorigins.win/raw?url=',
            'corsproxy': 'https://corsproxy.io/?',
            'none': ''  // 不使用代理
        };
        
        // 当前使用的代理
        let currentProxy = PROXY_SERVICES['cors-anywhere'];
        
        // 全局变量
        let currentForklift = null;
        let authorizedDrivers = [];
        let selectedDriver = null;
        
        // 切换代理服务
        function changeProxy(proxyName) {
            currentProxy = PROXY_SERVICES[proxyName];
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error-container').style.display = 'none';
            
            // 重新加载数据
            const urlParams = new URLSearchParams(window.location.search);
            const forkliftNo = urlParams.get('no') || '';
            if (forkliftNo) {
                loadData(forkliftNo);
            }
        }
        
        // 页面加载时执行
        document.addEventListener('DOMContentLoaded', function() {
            // 显示扫码时间
            document.getElementById('scan-time').textContent = new Date().toLocaleString('zh-CN');
            document.getElementById('data-update-time').textContent = new Date().toLocaleDateString('zh-CN');
            
            // 绑定重试按钮事件
            document.getElementById('retry-btn').addEventListener('click', function() {
                document.getElementById('error-container').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                const urlParams = new URLSearchParams(window.location.search);
                const forkliftNo = urlParams.get('no') || '';
                if (forkliftNo) {
                    loadData(forkliftNo);
                }
            });
            
            // 从URL获取叉车编号
            const urlParams = new URLSearchParams(window.location.search);
            const forkliftNo = urlParams.get('no') || '';
            
            if (forkliftNo) {
                // 如果有叉车编号，加载数据
                loadData(forkliftNo);
            } else {
                // 如果没有叉车编号，显示错误
                showError('请在URL中指定叉车编号，例如：?no=吉A09399');
            }
            
            // 监听ESC键关闭模态框
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeModal();
                }
            });
        });
        
        // 加载数据
        async function loadData(forkliftNo) {
            try {
                // 更新API状态
                updateApiStatus('connecting', '正在连接数据库...');
                
                // 1. 加载叉车信息
                const forklift = await getForkliftInfo(forkliftNo);
                if (!forklift) {
                    showError(`未找到编号为 "${forkliftNo}" 的叉车信息`);
                    updateApiStatus('error', '未找到叉车信息');
                    return;
                }
                
                currentForklift = forklift;
                
                // 2. 加载所有驾驶员信息
                const allDrivers = await getAllDrivers();
                if (!allDrivers || allDrivers.length === 0) {
                    showError('未找到任何驾驶员信息');
                    updateApiStatus('error', '未找到驾驶员信息');
                    return;
                }
                
                // 3. 根据授权驾驶员ID筛选出授权驾驶员
                authorizedDrivers = [];
                if (forklift.授权驾驶员 && Array.isArray(forklift.授权驾驶员) && forklift.授权驾驶员.length > 0) {
                    // 授权驾驶员存储的是驾驶员记录的ID数组
                    const authorizedDriverIds = forklift.授权驾驶员.map(driver => driver._id || driver);
                    
                    // 过滤出授权驾驶员
                    authorizedDrivers = allDrivers.filter(driver => 
                        authorizedDriverIds.includes(driver._id || driver.id)
                    );
                }
                
                // 4. 渲染页面
                renderForkliftInfo();
                renderDriversList();
                
                // 5. 显示内容，隐藏加载动画
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                // 更新API状态
                updateApiStatus('connected', `已连接，加载了 ${authorizedDrivers.length} 位驾驶员`);
                
            } catch (error) {
                console.error('加载数据失败:', error);
                showError('加载数据失败: ' + error.message);
                updateApiStatus('error', '连接失败');
            }
        }
        
        // 获取叉车信息
        async function getForkliftInfo(forkliftNo) {
            const targetUrl = `https://cloud.seatable.cn/dtable-server/api/v1/query/${SEATABLE_CONFIG.baseUuid}/`;
            
            // 构建请求URL
            let apiUrl;
            if (currentProxy === PROXY_SERVICES['none']) {
                apiUrl = targetUrl;
            } else if (currentProxy === PROXY_SERVICES['allorigins'] || currentProxy === PROXY_SERVICES['corsproxy']) {
                apiUrl = currentProxy + encodeURIComponent(targetUrl);
            } else {
                apiUrl = currentProxy + targetUrl;
            }
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Token ${SEATABLE_CONFIG.apiToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sql: `SELECT * FROM \`${SEATABLE_CONFIG.tableNames.forklift}\` WHERE \`车牌号\` = '${forkliftNo}'`
                })
            });
            
            if (!response.ok) {
                if (response.status === 403) {
                    throw new Error('API Token无效或权限不足');
                } else if (response.status === 404) {
                    throw new Error('未找到指定的数据表');
                } else if (response.status === 0) {
                    throw new Error('网络请求被阻止，可能是CORS问题，请尝试切换其他代理服务');
                } else {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
            }
            
            const data = await response.json();
            return data.results && data.results.length > 0 ? data.results[0] : null;
        }
        
        // 获取所有驾驶员信息
        async function getAllDrivers() {
            const targetUrl = `https://cloud.seatable.cn/dtable-server/api/v1/query/${SEATABLE_CONFIG.baseUuid}/`;
            
            // 构建请求URL
            let apiUrl;
            if (currentProxy === PROXY_SERVICES['none']) {
                apiUrl = targetUrl;
            } else if (currentProxy === PROXY_SERVICES['allorigins'] || currentProxy === PROXY_SERVICES['corsproxy']) {
                apiUrl = currentProxy + encodeURIComponent(targetUrl);
            } else {
                apiUrl = currentProxy + targetUrl;
            }
            
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Authorization': `Token ${SEATABLE_CONFIG.apiToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    sql: `SELECT * FROM \`${SEATABLE_CONFIG.tableNames.driver}\``
                })
            });
            
            if (!response.ok) {
                throw new Error(`获取驾驶员信息失败: ${response.status}`);
            }
            
            const data = await response.json();
            return data.results || [];
        }
        
        // 渲染叉车信息
        function renderForkliftInfo() {
            const container = document.getElementById('forklift-details');
            const f = currentForklift;
            
            container.innerHTML = `
                <div class="info-item">
                    <span class="label">车牌号</span>
                    <span class="value">${f.车牌号 || '未填写'}</span>
                </div>
                <div class="info-item">
                    <span class="label">设备型号</span>
                    <span class="value">${f.设备型号 || '未填写'}</span>
                </div>
                <div class="info-item">
                    <span class="label">所属区域</span>
                    <span class="value">${f.所属区域 || '未填写'}</span>
                </div>
                <div class="info-item">
                    <span class="label">授权驾驶员数</span>
                    <span class="value">${authorizedDrivers.length} 人</span>
                </div>
                ${f.二维码链接 ? `
                <div class="info-item">
                    <span class="label">二维码链接</span>
                    <span class="value" style="font-size: 12px; word-break: break-all;">${f.二维码链接.substring(0, 30)}...</span>
                </div>
                ` : ''}
            `;
            
            // 更新页面标题
            document.title = `叉车 ${f.车牌号} - 驾驶员核查`;
        }
        
        // 渲染驾驶员列表
        function renderDriversList() {
            const container = document.getElementById('drivers-container');
            
            if (authorizedDrivers.length === 0) {
                container.innerHTML = '<div class="no-drivers">此叉车暂无授权驾驶员，请在SeaTable中配置</div>';
                return;
            }
            
            let html = '';
            
            authorizedDrivers.forEach(driver => {
                // 判断证件状态
                const today = new Date();
                const validDate = new Date(driver.有效期限);
                const daysDiff = Math.ceil((validDate - today) / (1000 * 60 * 60 * 24));
                
                let statusClass = 'badge-valid';
                let statusText = '有效';
                let expiryClass = 'expiry-valid';
                
                if (daysDiff < 0) {
                    statusClass = 'badge-expired';
                    expiryClass = 'expiry-expired';
                    statusText = '已过期';
                } else if (daysDiff < 90) {
                    statusClass = 'badge-warning';
                    expiryClass = 'expiry-warning';
                    statusText = `${daysDiff}天后过期`;
                }
                
                // 格式化日期显示
                const formatDate = (dateStr) => {
                    if (!dateStr) return '未填写';
                    try {
                        const date = new Date(dateStr);
                        if (isNaN(date.getTime())) return dateStr;
                        return date.toLocaleDateString('zh-CN');
                    } catch (e) {
                        return dateStr;
                    }
                };
                
                // 处理照片
                let photoHtml = '';
                if (driver.照片 && driver.照片.length > 0) {
                    const photoUrl = driver.照片[0].url || driver.照片[0];
                    photoHtml = `
                        <div class="photo-container">
                            <img src="${photoUrl}" alt="${driver.姓名}的照片" class="driver-photo" onclick="showImage('${photoUrl}')">
                            <div style="text-align: center; font-size: 12px; color: #999; margin-top: 5px;">点击查看大图</div>
                        </div>
                    `;
                } else {
                    photoHtml = '<div class="no-photo">暂无照片</div>';
                }
                
                html += `
                    <div class="driver-card" onclick="selectDriver('${driver._id || driver.id}')" id="driver-${driver._id || driver.id}">
                        <div class="driver-header">
                            <div>
                                <div class="driver-name">${driver.姓名 || '未填写'}</div>
                                <div class="driver-id">工号: ${driver.工号 || '未填写'} | ${driver.性别 || '未填写'} | ${driver.岗位 || '未填写'}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="driver-details">
                            <div class="detail-row">
                                <span class="detail-label">证件号:</span>
                                <span class="detail-value">${driver.特种作业正号 || driver.特种作业证号 || '未填写'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">作业项目:</span>
                                <span class="detail-value">${driver.作业项目 || '未填写'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">发证机关:</span>
                                <span class="detail-value">${driver.发证机关 || '未填写'}</span>
                            </div>
                            
                            <div class="expiry-info">
                                <div>
                                    <div style="font-size: 12px; color: #8c8c8c;">有效期至</div>
                                    <div class="expiry-date ${expiryClass}">${formatDate(driver.有效期限)}</div>
                                </div>
                                ${driver.初领证日期 ? `
                                <div style="text-align: right;">
                                    <div style="font-size: 12px; color: #8c8c8c;">初领证日期</div>
                                    <div style="font-weight: 500;">${formatDate(driver.初领证日期)}</div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        
                        ${photoHtml}
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // 选择驾驶员
        function selectDriver(driverId) {
            selectedDriver = authorizedDrivers.find(d => (d._id || d.id) === driverId);
            
            if (!selectedDriver) return;
            
            // 移除所有选中状态
            document.querySelectorAll('.driver-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            // 添加当前选中状态
            document.getElementById(`driver-${driverId}`).classList.add('selected');
            
            // 更新按钮状态
            document.getElementById('submit-btn').disabled = false;
            document.getElementById('selected-driver-name').textContent = selectedDriver.姓名;
        }
        
        // 提交记录
        async function submitRecord() {
            if (!selectedDriver || !currentForklift) {
                alert('请先选择驾驶员');
                return;
            }
            
            const timestamp = new Date().toLocaleString('zh-CN');
            const record = {
                时间: timestamp,
                叉车: currentForklift.车牌号,
                驾驶员: selectedDriver.姓名,
                工号: selectedDriver.工号,
                操作类型: '扫码上岗'
            };
            
            // 显示成功消息
            alert(`✅ 记录成功！\n\n叉车: ${record.叉车}\n驾驶员: ${record.驾驶员}\n工号: ${record.工号}\n时间: ${record.时间}\n\n(演示模式，实际使用时会保存到数据库)`);
            
            // 在实际使用中，您可以在SeaTable中创建一个"操作记录"子表，然后通过API将记录插入
            console.log('操作记录:', record);
            
            // 重置选择（可选）
            setTimeout(() => {
                selectedDriver = null;
                document.querySelectorAll('.driver-card').forEach(card => {
                    card.classList.remove('selected');
                });
                document.getElementById('submit-btn').disabled = true;
                document.getElementById('selected-driver-name').textContent = '请从上方选择';
            }, 3000);
        }
        
        // 显示图片
        function showImage(url) {
            document.getElementById('modal-image').src = url;
            document.getElementById('image-modal').style.display = 'flex';
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('image-modal').style.display = 'none';
        }
        
        // 显示错误
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'none';
            document.getElementById('error-container').style.display = 'block';
            document.getElementById('error-message').textContent = message;
        }
        
        // 更新API状态显示
        function updateApiStatus(status, message) {
            const statusEl = document.getElementById('api-status');
            const indicator = statusEl.querySelector('.status-indicator');
            const text = statusEl.querySelector('span:last-child');
            
            // 移除所有状态类
            indicator.classList.remove('status-connected', 'status-disconnected');
            
            if (status === 'connected') {
                indicator.classList.add('status-connected');
                text.textContent = message || '已连接到数据库';
            } else if (status === 'error') {
                indicator.classList.add('status-disconnected');
                text.textContent = message || '连接失败';
            } else {
                indicator.classList.add('status-disconnected');
                text.textContent = message || '正在连接...';
            }
        }
    </script>
</body>
</html>
